{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Вход</h1>
        {% if form.errors %}
          <div class="alert alert-danger py-2">Неверный логин или пароль.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Логин</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Пароль</label>
            <input type="password" name="password" id="id_password" class="form-control" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
