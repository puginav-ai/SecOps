# On-prem стек GRC-консоли. Запуск: make up (см. Makefile в корне репозитория).
# На VM раскладка: /opt/grc/{.env, certs/, backups/, compose.yaml, ...} — здесь репозиторная (ops/).
# Коллектор discovery — профиль scan: make scan-up (см. SDD §2.2).
name: secops

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "40m"
      max-file: "5"

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: secops-web:latest
  env_file: ../.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    TZ: Europe/Moscow
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    env_file: ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    <<: *common
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redisdata:/data

  s3:
    <<: *common
    image: chrislusf/seaweedfs:4.48
    env_file: ../.env
    entrypoint: ["/bin/sh", "/run/entrypoint.sh"]
    volumes:
      - s3data:/data
      - ./seaweedfs/entrypoint.sh:/run/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://$(hostname):9333/cluster/healthz\""]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    <<: [*app, *common]
    command: gunicorn config.wsgi -b 0.0.0.0:8000 --workers 3 --timeout 60
    volumes:
      - static:/app/staticfiles

  worker:
    <<: [*app, *common]
    entrypoint: []
    command: celery -A config worker -l info

  beat:
    <<: [*app, *common]
    entrypoint: []
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule

  # Discovery: отдельный worker очереди scan. От root только здесь: nmap для ICMP-sweep
  # требует raw sockets (NET_RAW в default-наборе docker caps). Портов наружу нет.
  collector:
    <<: [*app, *common]
    profiles: ["scan"]
    entrypoint: []
    command: celery -A config worker -l info -Q scan
    user: "0:0"
    cap_add: ["NET_RAW"]

  nginx:
    <<: *common
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/grc.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - static:/usr/share/nginx/html/static:ro
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  s3data:
  static:
